# app.dex223.io deploys from the `production` branch. Run this from the Actions tab after checking a
# master commit on test-app.dex223.io. It moves `production` to that commit (latest master when
# `ref` is empty). Moving to an older commit, a rollback, needs the `rollback` box ticked.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "master commit to release (empty = latest master)"
        required: false
        default: ""
      rollback:
        description: "Allow moving production back to an older commit"
        type: boolean
        default: false

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      INPUT_REF: ${{ inputs.ref }}
      ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Move production
        run: |
          sha=$(git rev-parse --verify "${INPUT_REF:-origin/master}^{commit}") || {
            echo "::error::Unknown commit: $INPUT_REF"; exit 1; }
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on master. Only master commits are released."; exit 1
          fi

          force=""
          if git fetch origin production 2>/dev/null; then
            current=$(git rev-parse FETCH_HEAD)
            if [ "$current" = "$sha" ]; then
              echo "production is already at $sha."; exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$sha"; then
              if [ "$ROLLBACK" != "true" ]; then
                echo "::error::$sha is older than production ($current). Tick rollback to move back."; exit 1
              fi
              force="--force"
            fi
          fi

          git push $force origin "$sha:refs/heads/production"
          {
            echo "production -> \`$sha\`"
            echo
            git log -1 --format='%s (%an, %ad)' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"

# test-app.dex223.io deploys from the `public` branch, which carries exactly master's code: every
# master push is merged into it. PRs go to master, never to `public`.
#
# The merge is always a merge commit (--no-ff). Vercel skips any commit SHA it has already deployed,
# and master's SHA is already deployed to production, so a fast-forwarded `public` would never
# rebuild test-app.
#
# If `public` ever holds changes that master does not (its tree differs from master after the
# merge, or the merge conflicts), nothing is pushed and a PR from `public` into master is opened,
# so those changes are reviewed into master instead of drifting.
name: Sync public with master

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public
          fetch-depth: 0

      - name: Merge master into public
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff --no-edit -m "Sync public with master $(git rev-parse --short origin/master)" origin/master; then
            if git diff --quiet origin/master HEAD; then
              echo "result=merged" >> "$GITHUB_OUTPUT"
            else
              echo "result=diverged" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Push public
        if: steps.merge.outputs.result == 'merged'
        run: git push origin HEAD:public

      - name: Open a PR to bring public's own changes into master
        if: steps.merge.outputs.result == 'diverged'
        run: |
          existing=$(gh pr list --base master --head public --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open."
          else
            gh pr create --base master --head public \
              --title "Bring public's own changes into master" \
              --body "\`public\` has changes that master does not, so test-app.dex223.io is not updating. Review them here and merge with a merge commit, not squash. Changes for test-app go to master as PRs, not to \`public\`."
          fi
          echo "::warning::public has changes that master does not. See the open PR from public into master."

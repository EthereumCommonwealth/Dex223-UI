# test-app.dex223.io deploys from the `public` branch, which is a copy of master: every master push
# fast-forwards it. PRs go to master, never to `public`. If `public` ever has commits that master
# does not, nothing is pushed and a PR from `public` into master is opened, so those commits are
# reviewed into master instead of drifting.
name: Sync public with master

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public
          fetch-depth: 0

      - name: Fast-forward public to master
        id: merge
        run: |
          if git merge --ff-only origin/master; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Push public
        if: steps.merge.outputs.result == 'merged'
        run: git push origin HEAD:public

      - name: Open a PR to bring public's own commits into master
        if: steps.merge.outputs.result == 'diverged'
        run: |
          existing=$(gh pr list --base master --head public --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open."
          else
            gh pr create --base master --head public \
              --title "Bring public's own commits into master" \
              --body "\`public\` has commits that master does not, so test-app.dex223.io is not updating. Review them here and merge with a merge commit, not squash. Changes for test-app go to master as PRs, not to \`public\`."
          fi
          echo "::warning::public has commits that master does not. See the open PR from public into master."
